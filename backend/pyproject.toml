[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-sdn"
version = "1.3.0"
description = "Real SDN telemetry and machine learning DDoS detection"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<26", "httpx>=0.28,<1",
  "google-auth[requests]>=2.62,<3", "numpy>=2.2,<3", "scikit-learn>=1.6,<2", "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*", "collector*", "ml*"]

[tool.setuptools.package-data]
app = ["schema.sql", "migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
